<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}</style></head>
<body>
<script src="file:///home/hatch/workspace/makefun-gta6-3d/vice-3d/game/vendor/three.min.js"></script>
<script>
// NEWS TOWERS city scene — deterministic (seeded PRNG), rendered at 2048x1044
// (= the 1024x522 city band of the final page, at 2x for antialiasing).
// Hero towers are SOLVED onto a panel grid: for each card, the tower's world
// x and height are iterated until its front-face top edge projects onto the
// target slot (cx, roofY). Pillow then bolts a razor-sharp headline panel
// onto each roof line. Exports window.__anchors {n: {cx, top, w}} in px.

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
const rng = mulberry32(20261121);

const W = 2048, H = 1044;
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setSize(W, H);
renderer.setClearColor(0x000000, 0);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x2a1b40, 75, 175);

const camera = new THREE.PerspectiveCamera(35, W/H, 0.1, 500);
camera.position.set(0, 26, 72);
camera.lookAt(0, 9, -6);
camera.updateMatrixWorld(true); // solver projects before the first render

// ---------- lights ----------
scene.add(new THREE.HemisphereLight(0x8a7bd8, 0x1a1026, 0.55));
const sun = new THREE.DirectionalLight(0xffb066, 1.15);
sun.position.set(-22, 30, 24);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -60; sun.shadow.camera.right = 60;
sun.shadow.camera.top = 60; sun.shadow.camera.bottom = -40;
sun.shadow.camera.far = 170; sun.shadow.bias = -0.0006;
scene.add(sun);
const neonFill = new THREE.PointLight(0xd84fd8, 0.55, 130); neonFill.position.set(18, 12, 18); scene.add(neonFill);
const coolFill = new THREE.PointLight(0x4f7bd8, 0.4, 130); coolFill.position.set(-24, 8, 6); scene.add(coolFill);

// ---------- canvas texture helpers ----------
function groundTexture(){
  const c = document.createElement('canvas'); c.width = 1024; c.height = 640;
  const g = c.getContext('2d');
  g.fillStyle = '#161126'; g.fillRect(0,0,1024,640);
  const r = mulberry32(77);
  for (let i=0;i<2600;i++){ g.fillStyle = `rgba(255,255,255,${0.02+r()*0.03})`; g.fillRect(r()*1024, r()*640, 2, 2); }
  for (let bx=0; bx<8; bx++) for (let bz=0; bz<5; bz++){
    g.fillStyle = `rgba(${30+r()*14},${22+r()*10},${48+r()*16},0.55)`;
    g.fillRect(bx*128+10, bz*128+10, 108, 108);
  }
  g.fillStyle = '#0b0817';
  for (let i=0;i<=8;i++) g.fillRect(i*128-7, 0, 14, 640);
  for (let i=0;i<=5;i++) g.fillRect(0, i*128-7, 1024, 14);
  g.fillStyle = 'rgba(255,176,102,0.5)';
  for (let i=0;i<=8;i++) for (let y=6; y<640; y+=32) g.fillRect(i*128-1, y, 2, 16);
  for (let i=0;i<=5;i++) for (let x=6; x<1024; x+=32) g.fillRect(x, i*128-1, 16, 2);
  return new THREE.CanvasTexture(c);
}
function windowTexture(seed, litRatio, warmBias){
  const c = document.createElement('canvas'); c.width = 96; c.height = 224;
  const g = c.getContext('2d');
  const r = mulberry32(seed);
  g.fillStyle = '#0c1122'; g.fillRect(0,0,96,224);
  const warm = ['#ffd9a0','#ffb066','#fff3d6','#ffc98a'], cool = ['#bcd7ff','#d7e7ff','#9fc2ff'];
  for (let row=0; row<22; row++) for (let col=0; col<7; col++){
    const x = 6+col*13, y = 6+row*10;
    if (r() < litRatio){
      const pal = (r() < warmBias) ? warm : cool;
      g.fillStyle = pal[Math.floor(r()*pal.length)];
      g.globalAlpha = 0.55 + r()*0.45;
    } else { g.fillStyle = '#131a30'; g.globalAlpha = 1; }
    g.fillRect(x, y, 8, 6); g.globalAlpha = 1;
  }
  return new THREE.CanvasTexture(c);
}
function glowTexture(){
  const c = document.createElement('canvas'); c.width = 128; c.height = 128;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(64,64,2, 64,64,64);
  gr.addColorStop(0,'rgba(255,255,255,0.85)'); gr.addColorStop(0.35,'rgba(255,255,255,0.28)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0,0,128,128);
  return new THREE.CanvasTexture(c);
}
const glowTex = glowTexture();
function addGlow(x,y,z,scale,color,opacity){
  const m = new THREE.SpriteMaterial({map:glowTex, color:color, transparent:true, opacity:opacity, blending:THREE.AdditiveBlending, depthWrite:false});
  const s = new THREE.Sprite(m); s.position.set(x,y,z); s.scale.set(scale,scale,1); scene.add(s); return s;
}

// ---------- ground ----------
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(130, 78),
  new THREE.MeshStandardMaterial({map: groundTexture(), roughness: 0.38, metalness: 0.55})
);
ground.rotation.x = -Math.PI/2; ground.position.set(0, 0, -8);
ground.receiveShadow = true;
scene.add(ground);

// ---------- projection solver ----------
function proj(x, y, z){
  const p = new THREE.Vector3(x, y, z).project(camera);
  return {x: (p.x*0.5+0.5)*W, y: (-p.y*0.5+0.5)*H};
}
// Panel grid (final-page px, band coords): rows of slots.
const ROWS = [
  {z: -24, d: 9,  w: 20,   top: 6,   slots: [103, 307, 512, 717, 921], cards: [1, 6, 3, 4, 2]},
  {z: -8,  d: 10, w: 18,   top: 166, slots: [130, 385, 640, 895],      cards: [7, 8, 5, 9]},
  {z: 8,   d: 11, w: 16,   top: 326, slots: [130, 385, 640, 895],      cards: [11, 12, 10, 13]},
];
function solveTower(row, cxFinal, hGuess){
  const zf = row.z + row.d/2, tx = cxFinal*2, ty = row.top*2;
  let x = (cxFinal - 512) / 9.5, h = hGuess;
  for (let i=0;i<4;i++){
    const p0 = proj(x, h, zf), p1 = proj(x+1, h, zf), p2 = proj(x, h+1, zf);
    x += (tx - p0.x) / Math.max(1, (p1.x - p0.x));
    h += (ty - p0.y) / Math.min(-1, (p2.y - p0.y));
  }
  return {x: x, h: h};
}

// ---------- towers ----------
const NEON = [0xff4fd8, 0x37e0ff, 0xffb347, 0x7dff6a, 0xff5a5a, 0xb78bff];
function tower(x, z, w, h, d, seed, litRatio, opts){
  opts = opts || {};
  const tex = windowTexture(seed, litRatio, opts.warm !== undefined ? opts.warm : 0.72);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(Math.max(1, Math.round(w/7)), Math.max(1, Math.round(h/15)));
  const face = new THREE.MeshStandardMaterial({map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: opts.glow || 0.5, roughness: 0.32, metalness: 0.45});
  const side = new THREE.MeshStandardMaterial({map: tex, emissive: 0xffffff, emissiveMap: tex, emissiveIntensity: (opts.glow || 0.5)*0.7, color: 0x9aa0b8, roughness: 0.4, metalness: 0.4});
  const topM = new THREE.MeshStandardMaterial({color: 0x4a3f6e, roughness: 0.6, metalness: 0.3});
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [side, side, topM, topM, face, side]);
  m.position.set(x, h/2, z); m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  const neon = opts.neon !== undefined ? opts.neon : NEON[Math.floor(rng()*NEON.length)];
  // thin neon band along the FRONT top edge only (a sign strip, not a roof slab)
  const trim = new THREE.Mesh(new THREE.BoxGeometry(w+0.2, 0.34, 0.22), new THREE.MeshBasicMaterial({color: neon}));
  trim.position.set(x, h-0.15, z + d/2 + 0.08); scene.add(trim);
  addGlow(x, h+0.4, z+d/2+0.6, Math.max(6, w*0.9), neon, 0.20);
  // rooftop clutter (AC boxes, a water tank) on the back half of the roof
  if (h > 9){
    const cm = new THREE.MeshStandardMaterial({color: 0x2c2450, roughness: 0.7, metalness: 0.3});
    const ac = new THREE.Mesh(new THREE.BoxGeometry(w*0.22, 0.9, d*0.2), cm);
    ac.position.set(x - w*0.22, h + 0.45, z - d*0.18); ac.castShadow = true; scene.add(ac);
    if (rng() < 0.55){
      const tank = new THREE.Mesh(new THREE.CylinderGeometry(w*0.09, w*0.09, 1.6, 10), cm);
      tank.position.set(x + w*0.26, h + 0.8, z - d*0.15); tank.castShadow = true; scene.add(tank);
    }
  }
  return m;
}

window.__anchors = {};
const heroSpots = [];
ROWS.forEach(function(row, ri){
  row.cards.forEach(function(n, si){
    const sol = solveTower(row, row.slots[si], 30 - ri*6);
    tower(sol.x, row.z, row.w, sol.h, row.d, 1000+n*131, 0.62, {glow: 0.62, warm: 0.75});
    heroSpots.push([sol.x, row.z]);
    const zf = row.z + row.d/2;
    const tl = proj(sol.x - row.w/2, sol.h, zf), tr = proj(sol.x + row.w/2, sol.h, zf);
    const bc = proj(sol.x, 0, zf);
    window.__anchors[n] = {cx: (tl.x+tr.x)/2, top: tl.y, w: Math.abs(tr.x-tl.x), base: bc.y};
    if (n === 1){ // antenna + beacon on the tallest tower
      const ant = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.14, 6.5, 6), new THREE.MeshBasicMaterial({color: 0x222233}));
      ant.position.set(sol.x, sol.h+3.2, row.z); scene.add(ant);
      const bc2 = new THREE.Mesh(new THREE.SphereGeometry(0.42, 10, 10), new THREE.MeshBasicMaterial({color: 0xff3b30}));
      bc2.position.set(sol.x, sol.h+6.6, row.z); scene.add(bc2);
      addGlow(sol.x, sol.h+6.6, row.z, 7, 0xff3b30, 0.55);
    }
  });
});

// filler towers for density (seeded, kept clear of hero footprints)
let placed = 0, guard = 0;
while (placed < 34 && guard++ < 500){
  const x = -52 + rng()*104, z = -27 + rng()*42;
  if (heroSpots.some(s => Math.abs(s[0]-x) < 11 && Math.abs(s[1]-z) < 8)) continue;
  if (Math.abs(x) < 6 && z > -2) continue; // keep the central avenue clear
  const hgt = z < -18 ? 10 + rng()*17 : (z < -2 ? 6 + rng()*10 : 4 + rng()*7);
  tower(x, z, 5.5 + rng()*4.5, hgt, 5.5 + rng()*4, 5000+placed*77, 0.42 + rng()*0.2, {glow: 0.42, warm: 0.6});
  if (rng() < 0.4){
    const neon = NEON[Math.floor(rng()*NEON.length)];
    const sign = new THREE.Mesh(new THREE.BoxGeometry(0.5, hgt*0.55, 0.18), new THREE.MeshBasicMaterial({color: neon}));
    sign.position.set(x + (rng()<0.5?-1:1)*(2.2+rng()*1.4), hgt*0.5, z + 3.4);
    scene.add(sign);
    addGlow(sign.position.x, hgt*0.5, z+3.8, 8, neon, 0.30);
  }
  placed++;
}

// street lights + light pools + car streaks
for (const ax of [-24, 0, 24]) for (let z=-22; z<=13; z+=7){
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.30, 8, 8), new THREE.MeshBasicMaterial({color: 0xffd9a0}));
  lamp.position.set(ax, 1.5, z); scene.add(lamp);
  addGlow(ax, 1.5, z, 5.5, 0xffb066, 0.35);
  const pool = new THREE.Mesh(new THREE.CircleGeometry(2.6, 20),
    new THREE.MeshBasicMaterial({map: glowTex, color: 0xff9a4d, transparent: true, opacity: 0.16, blending: THREE.AdditiveBlending, depthWrite: false}));
  pool.rotation.x = -Math.PI/2; pool.position.set(ax, 0.06, z); scene.add(pool);
}
const streakCols = [0xffffff, 0xff4b3e, 0xfff2cc];
for (let i=0;i<16;i++){
  const vert = rng() < 0.5;
  const st = new THREE.Mesh(new THREE.BoxGeometry(vert?0.28:3.6, 0.1, vert?3.6:0.28),
    new THREE.MeshBasicMaterial({color: streakCols[Math.floor(rng()*3)]}));
  st.position.set(vert ? [-24,0,24][Math.floor(rng()*3)] : -48+rng()*96, 0.22, vert ? -24+rng()*38 : [-14,-1,12][Math.floor(rng()*3)]);
  scene.add(st);
}

renderer.render(scene, camera);
window.__done = true;
</script>
</body></html>
